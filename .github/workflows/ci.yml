name: BONUS UP baseline CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonus-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax (no bot startup)
        run: python -m compileall -q bot.py BONUS_UP_bot_miniapp.py tests
      - name: Check dependency consistency
        run: python -m pip check
      - name: Test tracking and postback routes using disposable data
        env:
          BOT_TOKEN: ci-test-token
          DB_PATH: ${{ runner.temp }}/bonus-up-ci.db
          POSTBACK_SECRET: ci-postback-secret
          TONPLAY_POSTBACK_SECRET: ci-tonplay-secret
          NORM_LACASINO_POSTBACK_SECRET: ci-norm-secret
        run: python -m unittest discover -s tests -v
