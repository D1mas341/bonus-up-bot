name: BONUS UP branch checks

on:
  pull_request:
    branches: [main]
    paths:
      - "bot.py"
      - "requirements.txt"
      - ".github/workflows/bonus-up-checks.yml"
  workflow_dispatch:

jobs:
  syntax-and-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile bot.py
      - name: Smoke-test import and additive SQLite migration
        env:
          BOT_TOKEN: "test-token-not-valid"
          DB_PATH: ${{ runner.temp }}/bonus-up-test.db
        run: |
          python - <<'PY'
          import os
          import sqlite3
          import bot

          db_path = os.environ["DB_PATH"]
          # Simulate a legacy database with a historical click row.
          with sqlite3.connect(db_path) as con:
              con.execute("""
                  CREATE TABLE clicks (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      user_id INTEGER,
                      offer_id INTEGER,
                      created_at DATETIME DEFAULT CURRENT_TIMESTAMP
                  )
              """)
              con.execute("INSERT INTO clicks(user_id, offer_id) VALUES(NULL, 17)")
          bot.init_db()
          with sqlite3.connect(db_path) as con:
              row = con.execute(
                  "SELECT offer_id, click_id FROM clicks WHERE id=1"
              ).fetchone()
              assert row == (17, None), row
              columns = {r[1] for r in con.execute("PRAGMA table_info(clicks)")}
              assert {"click_id", "source", "click_type", "utm_source", "utm_campaign"} <= columns
          with bot.db() as con:
              click_id = bot.log_click(
                  con, offer_id=17, source="ci-test",
                  click_type="offer", target_url="https://example.org/test"
              )
              con.commit()
              stored = con.execute(
                  "SELECT click_id, source, offer_id FROM clicks WHERE click_id=?",
                  (click_id,)
              ).fetchone()
              assert stored["click_id"] == click_id
              assert stored["source"] == "ci-test"
              assert stored["offer_id"] == 17
          print("PASS: import, legacy-row preservation, additive migration, click tracking")
          PY
