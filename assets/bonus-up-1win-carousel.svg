<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02091d"/><stop offset=".48" stop-color="#06276e"/><stop offset="1" stop-color="#020718"/></linearGradient>
 <radialGradient id="blueGlow"><stop stop-color="#087bff" stop-opacity=".8"/><stop offset="1" stop-color="#087bff" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#fff9b9"/><stop offset=".22" stop-color="#ffe56a"/><stop offset=".5" stop-color="#ffb800"/><stop offset=".76" stop-color="#d77c00"/><stop offset="1" stop-color="#fff2a0"/></linearGradient>
